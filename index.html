<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Xiaomi SmartTemp — BLE & ATC / BTHome Termometre İstasyonu</title>
  
  <!-- SEO & Social Meta -->
  <meta name="description" content="Xiaomi LYWSD03MMC, ATC1441, PVVX ve şifresiz BTHome Bluetooth BLE termometrelerini canlı dinleyen ve hafızadaki tüm sıcaklık, nem, batarya geçmişini grafikleyen modern web istasyonu.">
  <meta name="theme-color" id="metaThemeColor" content="#0f141c">

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Local Offline Tailwind CSS (Ultra-Fast) -->
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'system-ui', '-apple-system', 'sans-serif'],
            parkinsans: ['Parkinsans', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Local Vendor Scripts -->
  <script src="vendor/lucide.min.js"></script>
  <script src="vendor/chart.umd.min.js"></script>

  <!-- Core App Styling -->
  <link rel="stylesheet" href="style.css?v=10.0">
</head>
<body class="bg-[#f8fafc] text-[#0f172a] dark:bg-[#070b12] dark:text-[#f8fafc] font-sans antialiased min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

  <!-- DİNAMİK ATMOSFERİK AMBIENT GLOW -->
  <div id="ambientWeatherGlow" class="ambient-weather-glow bg-blue-500"></div>

  <!-- STICKY MODERN HEADER -->
  <header class="sticky top-0 z-40 bg-white/75 dark:bg-[#080d1a]/75 backdrop-blur-xl border-b border-black/5 dark:border-white/10 px-3 sm:px-6 py-2.5 transition-colors">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2.5 w-full">
      
      <!-- Left: Logo & Title -->
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-sky-400 text-white flex items-center justify-center shadow-lg shadow-blue-500/25 shrink-0">
          <i data-lucide="bluetooth" class="w-5 h-5"></i>
        </div>
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-1.5 min-w-0">
            <span class="text-base sm:text-lg font-black tracking-tight text-[#0f172a] dark:text-[#f8fafc] font-parkinsans">SmartTemp</span>
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-blue-500/10 text-blue-600 dark:text-sky-400 text-[9px] font-black tracking-wider uppercase border border-blue-500/20">
              <span id="bleStatusBadge" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span> BLE
            </span>
          </div>
          <span class="text-[10px] text-slate-500 dark:text-slate-400 font-semibold truncate">
            Xiaomi · ATC / PVVX · BTHome Şifresiz
          </span>
        </div>
      </div>

      <!-- Right Action Buttons -->
      <div class="flex items-center gap-2 shrink-0">
        
        <!-- MODEL BUTONU (KULLANICI TIKLAYINCA METEOROLOJİ MODEL İSTASYONUNA GEÇER) -->
        <a href="models.html" class="px-3 sm:px-4 py-1.5 rounded-xl text-xs font-extrabold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white flex items-center gap-1.5 cursor-pointer shadow-md shadow-blue-500/25 active:scale-95 transition-all text-decoration-none" title="Sayısal Hava Tahmin Modelleri İstasyonuna Git">
          <i data-lucide="layers" class="w-3.5 h-3.5"></i>
          <span>Hava Modelleri ➔</span>
        </a>

        <!-- Tema Değiştirici -->
        <button id="btnThemeToggle" title="Temayı Değiştir" aria-label="Temayı Değiştir" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 bg-white dark:bg-[#131c2e] hover:bg-slate-100 dark:hover:bg-[#1e293b] border border-slate-200 dark:border-white/10 flex items-center justify-center cursor-pointer shadow-xs active:scale-95">
          <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN DASHBOARD CONTAINER -->
  <!-- MAIN DASHBOARD CONTAINER (ULTRA MINIMAL: SADECE SICAKLIK, NEM, BUTONLAR VE GRAFİK) -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-5 pb-16 relative z-10">

    <!-- 1. SICAKLIK VE NEM + BUTONLAR KARTI -->
    <div class="apple-glass p-5 sm:p-7 space-y-6 w-full">
      
      <!-- Sadece Sıcaklık ve Nem Gösterimi -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        
        <!-- Sıcaklık -->
        <div class="p-5 sm:p-6 rounded-2xl bg-gradient-to-br from-amber-500/10 via-orange-500/5 to-transparent border border-orange-500/20 flex items-center justify-between">
          <div>
            <span class="text-xs uppercase font-extrabold tracking-wider text-orange-600 dark:text-orange-400 block mb-1">
              Sıcaklık
            </span>
            <div class="flex items-baseline gap-1.5">
              <span id="heroTempLive" class="text-6xl sm:text-7xl font-black text-[#0f172a] dark:text-[#f8fafc] font-parkinsans tracking-tight">--</span>
              <span class="text-3xl sm:text-4xl font-extrabold text-[#ea580c] dark:text-[#fb923c] font-parkinsans">°C</span>
            </div>
          </div>
          <div class="w-16 h-16 rounded-2xl bg-orange-500/15 text-orange-600 dark:text-orange-400 flex items-center justify-center shrink-0 text-3xl">
            🌡️
          </div>
        </div>

        <!-- Bağıl Nem -->
        <div class="p-5 sm:p-6 rounded-2xl bg-gradient-to-br from-blue-500/10 via-sky-500/5 to-transparent border border-blue-500/20 flex items-center justify-between">
          <div>
            <span class="text-xs uppercase font-extrabold tracking-wider text-blue-600 dark:text-sky-400 block mb-1">
              Bağıl Nem
            </span>
            <div class="flex items-baseline gap-1.5">
              <span id="heroHumLive" class="text-6xl sm:text-7xl font-black text-[#0f172a] dark:text-[#f8fafc] font-parkinsans tracking-tight">--</span>
              <span class="text-3xl sm:text-4xl font-extrabold text-[#2563eb] dark:text-[#38bdf8] font-parkinsans">%</span>
            </div>
          </div>
          <div class="w-16 h-16 rounded-2xl bg-blue-500/15 text-blue-600 dark:text-sky-400 flex items-center justify-center shrink-0 text-3xl">
            💧
          </div>
        </div>

      </div>

      <!-- İki Ana Buton: Bağlan & Kayıtları İndir -->
      <div class="flex flex-wrap items-center gap-3 pt-1">
        <!-- Bağlan Butonu -->
        <button id="btnConnectGatt" class="flex-1 sm:flex-none px-6 py-3.5 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-sky-500 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-blue-500/25 active:scale-95 transition-all">
          <i data-lucide="bluetooth" class="w-5 h-5"></i>
          <span>Bağlan</span>
        </button>

        <!-- Bağlantıyı Kes Butonu (Bağlıyken görünür) -->
        <button id="btnDisconnect" class="hidden flex-1 sm:flex-none px-6 py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-rose-500/25 active:scale-95 transition-all">
          <i data-lucide="power" class="w-5 h-5"></i>
          <span>Bağlantıyı Kes</span>
        </button>

        <!-- Kayıtları İndir Butonu -->
        <button id="btnDownloadRecords" class="flex-1 sm:flex-none px-6 py-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer active:scale-95 transition-all" title="Termometrenin flaş hafızasındaki tüm kayıtları çeker ve dosya olarak indirir">
          <i data-lucide="download" class="w-5 h-5 text-emerald-500"></i>
          <span>Kayıtları İndir</span>
        </button>

        <!-- Sıfırla İkonu (Sağ köşede) -->
        <button id="btnClearHistory" class="p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-slate-400 hover:text-rose-600 border border-slate-200 dark:border-slate-700 cursor-pointer ml-auto transition-all" title="Hafızayı Sıfırla">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      </div>

    </div>

    <!-- 2. ALTINDA ZAMAN SERİSİ GRAFİĞİ -->
    <div id="bleChartSection" class="apple-glass p-4 sm:p-6 space-y-4 w-full">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div>
          <h2 class="text-sm font-extrabold text-[#0f172a] dark:text-[#f8fafc] font-parkinsans">Zaman Serisi Grafiği</h2>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">Sıcaklık (°C) ve Bağıl Nem (%)</p>
        </div>

        <!-- Sade Zaman Aralığı Butonları -->
        <div class="inline-flex rounded-xl bg-slate-100 dark:bg-[#131c2e] p-0.5 border border-slate-200 dark:border-white/10 text-xs">
          <button class="ble-chart-range-btn px-3 py-1 font-bold cursor-pointer" data-range="6h">6s</button>
          <button class="ble-chart-range-btn px-3 py-1 font-bold cursor-pointer" data-range="24h">24s</button>
          <button class="ble-chart-range-btn px-3 py-1 font-bold cursor-pointer" data-range="7d">7 Gün</button>
          <button class="ble-chart-range-btn active px-3 py-1 font-bold cursor-pointer" data-range="all">Tümü</button>
        </div>
      </div>

      <!-- Tam Genişlik Canvas -->
      <div class="relative w-full h-80 sm:h-96">
        <canvas id="bleChartCanvas"></canvas>
      </div>
    </div>

  </main>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Scripts -->
  <script src="app.js?v=10.4"></script>
  <script src="ble-thermo.js?v=10.4"></script>
</body>
</html>
