<!DOCTYPE html>
<html lang="tr" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Xiaomi SmartTemp Pro — Akıllı Sıcaklık & Nem İstasyonu</title>
  <meta name="description" content="Xiaomi Mijia Bluetooth Termometre anlık ve geçmiş telemetri istasyonu." />
  <meta name="theme-color" content="#f8fafc" id="metaThemeColor" />

  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SmartTemp" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Tailwind CSS (Offline-First Local Vendor) -->
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Parkinsans', 'sans-serif'],
            mono: ['Parkinsans', 'sans-serif'],
          },
          screens: {
            'xs': '360px',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & Chart.js (Offline-First Local Vendors) -->
  <script src="vendor/lucide.min.js"></script>
  <script src="vendor/chart.umd.min.js"></script>

  <!-- Custom CSS (Zero Animation, Hardware Accelerated) -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#f8fafd] dark:bg-[#0c131c] text-[#1b1f24] dark:text-[#e2e8f0] min-h-screen flex flex-col font-sans selection:bg-[#0b57d0] selection:text-white">

  <!-- Ultra-Minimalist Unified Header (Single Line on All Screens) -->
  <header class="relative z-10 border-b border-[#d8e2ee] dark:border-[#263445] bg-[#ffffff] dark:bg-[#161f2b] sticky top-0 px-3 sm:px-6 py-2.5">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      
      <!-- Left: Sensor Hardware Clock & Status -->
      <div class="flex items-center gap-2 min-w-0" title="Sensör donanım saati (RTC)">
        <span id="sensorClockPulse" class="w-2.5 h-2.5 rounded-full bg-slate-400 dark:bg-slate-600 flex-shrink-0"></span>
        <div class="min-w-0">
          <div class="flex items-baseline gap-1.5">
            <span id="liveClockTime" class="text-base sm:text-xl font-extrabold font-mono tracking-tight text-slate-900 dark:text-white tabular-nums">--:--:--</span>
            <span id="connectionStatusText" class="text-[10px] sm:text-xs text-slate-500 dark:text-slate-400 font-semibold truncate hidden xs:inline">Sensör Saati</span>
          </div>
        </div>
      </div>

      <!-- Right: Direct Purpose-Driven Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
        
        <!-- Fetch Records Button -->
        <button id="btnFetchHistory" class="px-2.5 sm:px-4 py-2 rounded-full text-xs font-bold flex items-center gap-1.5 bg-[#d3e3fd] hover:bg-[#c2d7fb] text-[#041e49] dark:bg-[#0842a0] dark:hover:bg-[#0b57d0] dark:text-[#d3e3fd] shadow-sm cursor-pointer" title="Sensör flaş belleğindeki tüm kayıtları çek">
          <i data-lucide="download-cloud" class="w-3.5 h-3.5 shrink-0"></i>
          <span>Kayıtları Çek</span>
        </button>

        <!-- Connect / Disconnect Button -->
        <button id="btnConnect" class="px-3 sm:px-4 py-2 rounded-full text-xs font-bold flex items-center gap-1.5 bg-[#0b57d0] hover:bg-[#0842a0] text-white shadow-sm cursor-pointer">
          <i data-lucide="bluetooth" class="w-3.5 h-3.5 shrink-0"></i>
          <span id="btnConnectLabel">Bağlan</span>
        </button>

        <!-- Theme Toggle Button -->
        <button id="btnThemeToggle" title="Temayı Değiştir" aria-label="Temayı Değiştir" class="p-2 rounded-full text-slate-600 dark:text-slate-300 bg-[#edf2f9] dark:bg-[#1e2938] hover:bg-[#e0e8f4] dark:hover:bg-[#253346] border border-[#d8e2ee] dark:border-[#2e3b4e] flex items-center justify-center cursor-pointer">
          <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
        </button>

      </div>

    </div>
  </header>

  <!-- Main Dashboard Container -->
  <main class="relative z-10 flex-1 max-w-6xl w-full mx-auto p-3 sm:p-5 lg:p-6 space-y-3 sm:space-y-4 pb-12">

    <!-- Progress Notification Banner (Visible only during memory sync) -->
    <div id="syncProgressBanner" class="hidden p-3 rounded-2xl bg-[#d3e3fd] dark:bg-[#0842a0]/60 border border-[#0b57d0]/20">
      <div class="flex items-center justify-between gap-2 mb-1.5">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-[#0b57d0] dark:bg-[#a8c7fa]"></div>
          <span id="syncProgressLabel" class="text-xs font-medium text-[#041e49] dark:text-[#d3e3fd]">Flaş bellek taranıyor...</span>
        </div>
        <span id="syncProgressPercent" class="text-xs font-mono font-bold text-[#0b57d0] dark:text-[#a8c7fa]">0%</span>
      </div>
      <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
        <div id="syncProgressBar" class="h-full bg-[#0b57d0] dark:bg-[#a8c7fa] rounded-full" style="width: 0%"></div>
      </div>
    </div>

    <!-- 3 PRIMARY TELEMETRY CARDS (Sıcaklık, Bağıl Nem, Pil Voltajı) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-4">
      
      <!-- Card 1: Sıcaklık (Temperature) -->
      <div class="m3-card p-4 sm:p-5 flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-1.5">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 flex items-center gap-1.5">
            <i data-lucide="thermometer" class="w-4 h-4 text-[#0b57d0] dark:text-[#a8c7fa]"></i>
            Sıcaklık
          </span>
          <button id="btnToggleUnit" class="text-xs font-mono font-bold px-2.5 py-0.5 rounded-full bg-[#edf2f9] dark:bg-[#1e2938] text-[#0b57d0] dark:text-[#a8c7fa] border border-[#d8e2ee] dark:border-[#2e3b4e] cursor-pointer" title="Birim değiştir">
            °C / °F
          </button>
        </div>
        <div class="flex items-baseline gap-1 py-1">
          <span id="valTemp" class="text-4xl sm:text-4xl lg:text-5xl font-extrabold font-mono text-slate-900 dark:text-slate-100 tabular-nums">--.--</span>
          <span id="lblTempUnit" class="text-xl sm:text-2xl font-bold text-[#0b57d0] dark:text-[#a8c7fa]">°C</span>
        </div>
        <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden mt-1.5">
          <div id="tempProgressBar" class="h-full bg-[#0b57d0] dark:bg-[#60a5fa] rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <!-- Card 2: Bağıl Nem (Relative Humidity) -->
      <div class="m3-card p-4 sm:p-5 flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-1.5">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 flex items-center gap-1.5">
            <i data-lucide="droplets" class="w-4 h-4 text-sky-500"></i>
            Bağıl Nem
          </span>
          <span id="humidityStatusBadge" class="text-[11px] px-2.5 py-0.5 rounded-full bg-sky-100 text-[#0284c7] dark:bg-sky-950/80 dark:text-sky-300 font-semibold">
            Bekleniyor
          </span>
        </div>
        <div class="flex items-baseline gap-1 py-1">
          <span id="valHum" class="text-4xl sm:text-4xl lg:text-5xl font-extrabold font-mono text-slate-900 dark:text-slate-100 tabular-nums">--.--</span>
          <span class="text-xl sm:text-2xl font-bold text-sky-500">%</span>
        </div>
        <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden mt-1.5">
          <div id="humProgressBar" class="h-full bg-sky-500 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <!-- Card 3: Pil Voltajı (Direct Sensor Voltage in V) -->
      <div class="m3-card p-4 sm:p-5 flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-1.5">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 flex items-center gap-1.5">
            <i data-lucide="battery-charging" class="w-4 h-4 text-emerald-500"></i>
            Pil Voltajı
          </span>
          <span id="valVoltageBadge" class="text-[11px] font-mono font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-300">
            -- mV
          </span>
        </div>
        <div class="flex items-baseline gap-1 py-1">
          <span id="valBattery" class="text-4xl sm:text-4xl lg:text-5xl font-extrabold font-mono text-slate-900 dark:text-slate-100 tabular-nums">--.--</span>
          <span class="text-xl sm:text-2xl font-bold text-emerald-500">V</span>
        </div>
        <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden mt-1.5">
          <div id="batteryProgressBar" class="h-full bg-emerald-500 rounded-full" style="width: 0%"></div>
        </div>
      </div>

    </div>

    <!-- Minimalist Chart Section -->
    <div id="chartCard" class="m3-card p-3 sm:p-5 space-y-2.5">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#d8e2ee] dark:border-[#263445] pb-2.5">
        <div class="flex items-center justify-between w-full sm:w-auto gap-2">
          <h2 class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5 shrink-0">
            <i data-lucide="line-chart" class="w-4 h-4 text-[#0b57d0] dark:text-[#a8c7fa]"></i>
            <span>Ölçüm Grafiği</span>
          </h2>

          <!-- Mobile-visible Fullscreen button right next to title on small screens -->
          <button id="btnToggleFullscreenChartMobile" class="sm:hidden px-2.5 py-1 rounded-full bg-[#edf2f9] dark:bg-[#1e2938] hover:bg-[#e0e8f4] dark:hover:bg-[#253346] text-slate-700 dark:text-slate-200 border border-[#d8e2ee] dark:border-[#2e3b4e] flex items-center gap-1 text-[11px] font-bold cursor-pointer" title="Grafiği Tam Ekran Büyüt / Küçült" aria-label="Grafiği Büyüt">
            <i id="iconChartFullscreenMobile" data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
            <span id="lblChartFullscreenMobile">Büyüt</span>
          </button>
        </div>

        <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-2">
          <!-- Mode Buttons (Sıcaklık, Nem, Voltaj, Tümü) -->
          <div class="inline-flex w-full sm:w-auto justify-between sm:justify-start rounded-full bg-[#edf2f9] dark:bg-[#1e2938] p-0.5 border border-[#d8e2ee] dark:border-[#2e3b4e] text-[11px] sm:text-xs">
            <button class="mode-btn active flex-1 sm:flex-initial px-2.5 sm:px-3 py-1 font-semibold cursor-pointer" data-mode="temps">Sıcaklık</button>
            <button class="mode-btn flex-1 sm:flex-initial px-2.5 sm:px-3 py-1 font-semibold cursor-pointer" data-mode="hum">Nem</button>
            <button class="mode-btn flex-1 sm:flex-initial px-2.5 sm:px-3 py-1 font-semibold cursor-pointer" data-mode="battery">Voltaj (V)</button>
            <button class="mode-btn flex-1 sm:flex-initial px-2.5 sm:px-3 py-1 font-semibold cursor-pointer" data-mode="all">Tümü</button>
          </div>

          <!-- Desktop Büyüt / Küçült (Fullscreen) Butonu -->
          <button id="btnToggleFullscreenChart" class="hidden sm:flex px-3 py-1.5 rounded-full bg-[#edf2f9] dark:bg-[#1e2938] hover:bg-[#e0e8f4] dark:hover:bg-[#253346] text-slate-700 dark:text-slate-200 border border-[#d8e2ee] dark:border-[#2e3b4e] items-center gap-1.5 text-xs font-bold cursor-pointer" title="Grafiği Tam Ekran Büyüt / Küçült" aria-label="Grafiği Büyüt">
            <i id="iconChartFullscreen" data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
            <span id="lblChartFullscreen">Büyüt</span>
          </button>
        </div>
      </div>

      <!-- Chart Canvas Container -->
      <div id="chartCanvasContainer" class="relative w-full h-60 sm:h-80 lg:h-96">
        <div id="chartEmptyOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-white dark:bg-[#161f2b] z-10 rounded-2xl text-center p-4">
          <i data-lucide="radio" class="w-6 h-6 text-[#0b57d0] dark:text-[#a8c7fa] mb-1.5"></i>
          <p class="text-xs text-slate-500 dark:text-slate-400">Veri bekleniyor... <strong>"Bağlan"</strong> veya <strong>"Kayıtları Çek"</strong> butonuna basabilirsiniz.</p>
        </div>
        <canvas id="telemetryChart"></canvas>
      </div>
    </div>

    <!-- Minimalist History Records Section -->
    <div class="m3-card p-3 sm:p-5 space-y-2.5">
      <div class="flex items-center justify-between gap-2 border-b border-[#d8e2ee] dark:border-[#263445] pb-2">
        <div class="flex items-center gap-2">
          <h2 class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
            <i data-lucide="database" class="w-4 h-4 text-[#0b57d0] dark:text-[#a8c7fa]"></i>
            <span>Geçmiş Ölçümler</span>
          </h2>
          <span id="tableSummaryText" class="text-[11px] font-mono text-slate-500 dark:text-slate-400">0 kayıt</span>
        </div>

        <div class="flex items-center gap-1.5">
          <button id="btnExportCsv" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-[#edf2f9] dark:bg-[#1e2938] hover:bg-[#e0e8f4] dark:hover:bg-[#253346] text-[#0b57d0] dark:text-[#a8c7fa] border border-[#d8e2ee] dark:border-[#2e3b4e] flex items-center gap-1">
            <i data-lucide="download" class="w-3 h-3"></i>
            <span>CSV</span>
          </button>
          <button id="btnClearData" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900/50 flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3 h-3"></i>
            <span>Temizle</span>
          </button>
        </div>
      </div>

      <!-- Single Ultra-Lightweight Table (Mobile & Desktop Unified) -->
      <div class="overflow-x-auto rounded-xl border border-[#d8e2ee] dark:border-[#263445]">
        <table class="w-full text-left text-xs text-slate-700 dark:text-slate-300">
          <thead class="bg-[#edf2f9] dark:bg-[#1e2938] uppercase font-mono text-[10px] text-slate-600 dark:text-slate-400 border-b border-[#d8e2ee] dark:border-[#263445]">
            <tr>
              <th scope="col" class="py-2 px-2.5 sm:px-3">Zaman</th>
              <th scope="col" class="py-2 px-2 sm:px-3">Sıcaklık</th>
              <th scope="col" class="py-2 px-2 sm:px-3">Nem</th>
              <th scope="col" class="py-2 px-2 sm:px-3">Voltaj (V)</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" class="divide-y divide-[#d8e2ee]/60 dark:divide-[#263445]/60 font-mono text-[11px] sm:text-xs">
            <tr>
              <td colspan="4" class="py-6 text-center text-slate-400 dark:text-slate-500 font-sans">
                Henüz kayıt bulunmuyor.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Controls -->
      <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 pt-0.5">
        <button id="btnPrevPage" disabled class="px-3 py-1 rounded-full bg-[#edf2f9] dark:bg-[#1e2938] disabled:opacity-30 text-slate-700 dark:text-slate-300 border border-[#d8e2ee] dark:border-[#2e3b4e]">Önceki</button>
        <span id="pageIndicator" class="font-mono text-slate-700 dark:text-slate-300 font-semibold px-2">1 / 1</span>
        <button id="btnNextPage" disabled class="px-3 py-1 rounded-full bg-[#edf2f9] dark:bg-[#1e2938] disabled:opacity-30 text-slate-700 dark:text-slate-300 border border-[#d8e2ee] dark:border-[#2e3b4e]">Sonraki</button>
      </div>

    </div>

  </main>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-4 left-3 right-3 sm:left-auto sm:right-6 z-50 flex flex-col gap-2 pointer-events-none max-w-sm mx-auto sm:mx-0"></div>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
